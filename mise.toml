[tasks.ci]
run = [
  "cargo clippy",
  "cargo fmt --check",
  "cargo test -- --test-threads=1",
  "cargo run --example progress",
]

[tools]
# hk.pkl amends a pinned hk package; the tool itself floats and is resolved by mise.lock.
hk = { version = "latest", minimum_release_age = "0s" }
jactionlint = "latest"
pkl = { version = "latest", minimum_release_age = "0s" }
"cargo:cargo-msrv" = "latest"
